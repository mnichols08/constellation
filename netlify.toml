# Netlify hosts only the GitHub sign-in exchange and hosted-AI functions. GitHub Pages
# serves the Studio itself. See docs/github-oauth.md.
[build]
  publish = "auth/netlify/public"
  command = "npm ci --prefix auth/netlify --omit=dev --ignore-scripts"

[functions]
  directory = "auth/netlify/functions"
  node_bundler = "esbuild"
