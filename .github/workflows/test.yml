name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/constellation-core/Cargo.toml
      - name: Rebuild Rust engine and verify integration
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          npm run build:rust
          npm test
      - uses: ./
        with:
          output: dist/smoke.svg
