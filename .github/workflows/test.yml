name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONSTELLATION_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm test
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/constellation-core/Cargo.toml
      - name: Rebuild Rust engine and verify integration
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          npm run build:rust
          npm run build:core
          node scripts/build-extensions.mjs
          node scripts/benchmark-html.mjs
          node scripts/benchmark-timeline.mjs
          node scripts/benchmark-hierarchy.mjs
          node scripts/benchmark-story.mjs
          npm test
      - uses: ./
        with:
          output: dist/smoke.svg
