[package]
name = "constellation-spec"
version = "1.0.0"
edition = "2021"
publish = false
description = "ConstellationSpec: validated semantic intent, evidence resolution and graph-intent compilation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
# One codegen unit lets LTO deduplicate across the crate, as in constellation-core.
codegen-units = 1
